<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>ANU LIVE NUMBER PANEL</title>

<style>

:root{

  --bg:#070A13;
  --bg2:#0B1530;

  --border:rgba(255,255,255,.14);

  --text:#EEF3FF;
  --muted:#A7B3D1;

  --blue1:#4F8CFF;
  --blue2:#2563EB;

  --green1:#22c55e;
  --green2:#16a34a;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{

  width:100%;
  height:100%;

  overflow-x:hidden;
}

body{

  background:linear-gradient(
    135deg,
    var(--bg),
    var(--bg2)
  );

  font-family:sans-serif;

  color:var(--text);

  padding:0;
}

/* FULL SCREEN */

.card{

  width:100vw;

  min-height:100vh;

  background:rgba(255,255,255,.06);

  padding:10px;
}

/* TOP */

.top{

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:10px;

  gap:8px;
}

.title{

  font-size:18px;

  font-weight:900;
}

.sub{

  color:var(--muted);

  font-size:11px;
}

.badge{

  border:1px solid var(--border);

  border-radius:999px;

  padding:5px 10px;

  font-size:10px;
}

/* PANEL */

.panel{

  width:100%;

  background:rgba(0,0,0,.22);

  border:1px solid var(--border);

  border-radius:14px;

  padding:10px;
}

/* SERVICES */

.servicesWrap{

  overflow-x:auto;

  margin-bottom:10px;

  scrollbar-width:none;
}

.servicesWrap::-webkit-scrollbar{
  display:none;
}

.services{

  display:flex;

  gap:7px;

  width:max-content;
}

.service{

  border-radius:10px;

  padding:7px 10px;

  font-size:11px;

  font-weight:900;

  cursor:pointer;

  white-space:nowrap;

  border:1px solid rgba(255,255,255,.08);

  background:#111827;
}

.service.hasNumbers{

  background:linear-gradient(
    135deg,
    var(--green1),
    var(--green2)
  );
}

.service.active{

  background:linear-gradient(
    135deg,
    var(--blue1),
    var(--blue2)
  ) !important;
}

/* INFO */

.info{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:7px;

  margin-bottom:10px;
}

.box{

  border:1px solid var(--border);

  border-radius:10px;

  padding:8px;
}

.label{

  color:var(--muted);

  font-size:9px;
}

.value{

  font-size:18px;

  font-weight:900;
}

/* BUTTON */

.getBtn{

  width:100%;

  border:none;

  border-radius:10px;

  padding:11px;

  font-size:14px;

  font-weight:900;

  cursor:pointer;

  color:#fff;

  margin-bottom:8px;

  background:linear-gradient(
    135deg,
    var(--blue1),
    var(--blue2)
  );
}

/* LIVE */

.live{

  display:grid;

  gap:4px;
}

.nbox{

  height:34px;

  border:1px solid var(--border);

  border-radius:8px;

  padding:4px 6px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  background:rgba(255,255,255,.03);
}

.num{

  flex:1;

  font-size:11px;

  font-weight:900;

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;
}

.copyBtn{

  border:none;

  border-radius:5px;

  padding:3px 7px;

  font-size:9px;

  font-weight:900;

  cursor:pointer;

  color:#fff;

  background:linear-gradient(
    135deg,
    var(--green1),
    var(--green2)
  );
}

/* COPY ALL */

.copyAllBtn{

  width:100%;

  border:none;

  border-radius:10px;

  padding:9px;

  font-size:12px;

  font-weight:900;

  cursor:pointer;

  margin-top:6px;

  color:#fff;

  background:linear-gradient(
    135deg,
    #7c3aed,
    #9333ea
  );
}

/* WEBVIEW */

.webviewBox{

  margin-top:12px;

  width:100%;

  height:850px;

  border:1px solid var(--border);

  border-radius:12px;

  overflow:hidden;
}

.webviewBox iframe{

  width:100%;

  height:100%;

  border:none;
}

/* BIG TOAST */

.toast{

  position:fixed;

  top:10px;

  left:50%;

  transform:translateX(-50%);

  width:96%;

  background:rgba(0,0,0,.92);

  border:1px solid rgba(255,255,255,.15);

  border-radius:12px;

  padding:14px 12px;

  opacity:0;

  transition:.18s;

  font-weight:900;

  z-index:999;

  font-size:15px;

  line-height:1.6;

  text-align:center;

  word-break:break-word;

  overflow-wrap:break-word;
}

.toast.show{
  opacity:1;
}

</style>
</head>

<body>

<div class="toast"
id="toast"></div>

<div class="card">

<div class="top">

<div>

<div class="title">
ANU PANEL
</div>

<div class="sub">
Created By Tamim
</div>

</div>

<div class="badge">
🖥️ TAMIM ANU 🇧🇩
</div>

</div>

<div class="panel">

<!-- SERVICES -->

<div class="servicesWrap">

<div class="services"
id="services"></div>

</div>

<!-- INFO -->

<div class="info">

<div class="box">

<div class="label">
RANGE TOTAL NUMBER
</div>

<div class="value"
id="rangeTotal">
0
</div>

</div>

<div class="box">

<div class="label">
PANEL TOTAL NUMBER
</div>

<div class="value"
id="panelTotal">
0
</div>

</div>

</div>

<!-- GET -->

<button class="getBtn"
id="getBtn">

╰┈➤ GET NUMBER 💻✌︎㋡

</button>

<!-- LIVE -->

<div class="live"
id="live"></div>

<!-- COPY ALL -->

<button class="copyAllBtn"
id="copyAllBtn">

📋 COPY ALL + CLEAR

</button>

<!-- WEBVIEW -->

<div class="webviewBox">

<iframe
id="anuFrame"
src="https://anu-panel-rgqw.onrender.com/"
allow="clipboard-read; clipboard-write">
</iframe>

</div>

</div>
</div>

<script>

const URL="https://script.google.com/macros/s/AKfycbxs5UnBzGbXDsbX_I027WP7RVdGrKBuKZpYGGPEee3l6lkr670YDne_A-cwdznjFeWMhg/exec";

const SERVICES=[

"rangeid0",
"rangeid02",
"rangeid0",
"rangeid04",
"rangeid05",

"rangeid06",
"rangeid07",
"rangeid08",
"rangeid09",
"rangeid10"

];

const WAIT_TIME=60000;

let lastGetTime=0;

const servicesEl=
document.getElementById("services");

const rangeTotalEl=
document.getElementById("rangeTotal");

const panelTotalEl=
document.getElementById("panelTotal");

const liveEl=
document.getElementById("live");

const toast=
document.getElementById("toast");

let slots=[

{num:"",active:false},
{num:"",active:false},
{num:"",active:false}

];

/* TOAST */

function showToast(t,duration=3000){

toast.textContent=t;

toast.classList.add("show");

clearTimeout(window.toastTimer);

window.toastTimer=setTimeout(()=>{

toast.classList.remove("show");

},duration);

}

/* IFRAME COPY */

window.addEventListener("message",async(e)=>{

try{

if(e.data.type==="copy"){

await navigator
.clipboard
.writeText(
e.data.text
);

showToast("Copied");

}

}catch{

showToast("Copy Failed");

}

});

/* SERVICE */

function getService(){

return localStorage
.getItem("service")
|| "rangeid01";

}

function setService(v){

localStorage
.setItem("service",v);

document
.querySelectorAll(".service")
.forEach(s=>{

s.classList.remove("active");

});

const btn=document.querySelector(

`[data-service="${v}"]`

);

if(btn){

btn.classList.add("active");

}

}

/* RENDER */

function renderServices(){

servicesEl.innerHTML="";

SERVICES.forEach((s,i)=>{

servicesEl.innerHTML+=`

<div
class="service"
data-service="${s}">

Range ${(i+1)
.toString()
.padStart(2,"0")}

</div>

`;

});

document
.querySelectorAll(".service")
.forEach(btn=>{

btn.onclick=()=>{

setService(
btn.dataset.service
);

loadTotals();

updateServiceLights();

};

});

setService(
getService()
);

}

/* LIGHT */

async function updateServiceLights(){

SERVICES.forEach(async s=>{

try{

const r=await fetch(

URL+
"?action=total&service="+s

);

const d=await r.json();

const btn=document.querySelector(

`[data-service="${s}"]`

);

if(!btn) return;

btn.classList.remove(
"hasNumbers"
);

if(
Number(d.total)>0 &&
s!==getService()
){

btn.classList.add(
"hasNumbers"
);

}

}catch{}

});

}

/* BOX */

function renderBoxes(){

liveEl.innerHTML="";

slots.forEach((slot,index)=>{

liveEl.innerHTML+=`

<div class="nbox">

<div class="num">

${slot.num}

</div>

${slot.active ? `

<button
class="copyBtn"
onclick="copySlot(${index})">

COPY

</button>

` : ``}

</div>

`;

});

}

/* TOTAL */

async function loadTotals(){

try{

const [r1,r2]=await Promise.all([

fetch(
URL+
"?action=total&service="+
getService()
),

fetch(
URL+
"?action=alltotal"
)

]);

const d1=await r1.json();

const d2=await r2.json();

rangeTotalEl.textContent=
d1.total || 0;

panelTotalEl.textContent=
d2.total || 0;

}catch{}

}

/* GET */

async function getNumbers(){

const now=Date.now();

if(now-lastGetTime<WAIT_TIME){

showToast(

"বস, আপনার কী খুব ক্ষুধা পেয়েছে নাকি? 😒 নাম্বার না খেয়ে খাবার খান। মাত্র যে ৩টা নাম্বার নিলেন, সেগুলা কি আত্মহত্যা করেছে? 🤦‍♂️ না মানে যেভাবে নাম্বার খাওয়া শুরু করেছেন, মনে হচ্ছে আমি নাম্বার না… এক প্লেট কাচ্চি বিরিয়ানি! 😬🍗😂",

30000

);

return;

}

try{

const r=await fetch(

URL+
"?action=get"+
"&service="+
getService()+
"&need=3"

);

const d=await r.json();

const nums=d.numbers || [];

if(nums.length===0){

showToast("NO NUMBER FOUND");

return;

}

/* RESET */

slots=[

{num:"",active:false},
{num:"",active:false},
{num:"",active:false}

];

/* ADD */

nums.slice(0,3)
.forEach((num,i)=>{

slots[i]={

num:num,
active:true

};

});

lastGetTime=Date.now();

renderBoxes();

loadTotals();

updateServiceLights();

}catch{

showToast("ERROR");

}

}

/* COPY */

async function copySlot(i){

await navigator
.clipboard
.writeText(
slots[i].num
);

slots[i]={

num:"",
active:false

};

renderBoxes();

showToast("COPIED");

}

/* COPY ALL */

document
.getElementById("copyAllBtn")
.onclick=async()=>{

let all=slots
.filter(s=>s.num)
.map(s=>s.num)
.join("\n");

if(!all){

showToast("EMPTY");

return;

}

await navigator
.clipboard
.writeText(all);

slots=[

{num:"",active:false},
{num:"",active:false},
{num:"",active:false}

];

renderBoxes();

showToast("ALL COPIED & CLEARED");

};

/* INIT */

document
.getElementById("getBtn")
.onclick=getNumbers;

renderServices();

renderBoxes();

loadTotals();

updateServiceLights();

</script>

</body>
</html>
